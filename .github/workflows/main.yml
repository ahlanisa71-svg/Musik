name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Susun folder proyek (file hasil upload HP yang rata)
        run: |
          python3 - <<'PY'
          import os, shutil
          B = "app/src/main/"
          J = B + "java/com/glassplayer/app/"
          moves = {
            "AndroidManifest.xml": B,
            "MainActivity.kt": J, "MusicViewModel.kt": J,
            "PlaybackService.kt": J, "LockScreenActivity.kt": J,
            "Models.kt": J + "data/", "MediaRepository.kt": J + "data/",
            "Store.kt": J + "data/", "ArtLoader.kt": J + "data/",
            "Theme.kt": J + "ui/", "Components.kt": J + "ui/", "Screens.kt": J + "ui/",
            "NowPlaying.kt": J + "ui/", "LockScreen.kt": J + "ui/", "Splash.kt": J + "ui/",
            "colors.xml": B + "res/values/", "strings.xml": B + "res/values/",
            "themes.xml": B + "res/values/",
            "ic_launcher_background.xml": B + "res/drawable/",
            "ic_launcher_foreground.xml": B + "res/drawable/",
            "ic_launcher_monochrome.xml": B + "res/drawable/",
            "ic_launcher.xml": B + "res/mipmap-anydpi-v26/",
            "ic_launcher_round.xml": B + "res/mipmap-anydpi-v26/",
          }
          for name, dest in moves.items():
              if os.path.isfile(name):
                  os.makedirs(dest, exist_ok=True)
                  shutil.move(name, dest + name)
                  print("pindah", name, "->", dest)
          PY

      - name: Tulis file Gradle (ada dua nama sama, jadi dibuat ulang di sini)
        run: |
          mkdir -p app
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.glassplayer.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.glassplayer.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
                  freeCompilerArgs += "-opt-in=androidx.media3.common.util.UnstableApi"
              }

              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.09.03")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")

              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.6")

              implementation("androidx.media3:media3-exoplayer:1.4.1")
              implementation("androidx.media3:media3-session:1.4.1")
              implementation("com.google.guava:guava:32.1.3-android")
          }
          EOF

      - name: Cek struktur
        run: |
          find . -path ./.git -prune -o -type f -print | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GlassPlayer.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassPlayer-apk
          path: GlassPlayer.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Glass Player build ${{ github.run_number }}
          files: GlassPlayer.apk
          make_latest: true
